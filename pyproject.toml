[project]
name = "cladoscope"
version = "0.1.0"
description = "Entity-level C++ dependency graph tooling for planning a modules migration"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "libclang>=18.0",
]

[project.scripts]
cladoscope = "cladoscope.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false  # tighten once the shape settles
